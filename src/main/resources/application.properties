# Secrets loaded from git-ignored .env
spring.config.import=optional:file:.env[.properties]

spring.application.name=agentforge

# Chat and embedding are separate connections, both need the key
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# gemini-3.6-flash: tool-calling reliability over Flash-Lite's lower cost
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# One property, used by both embedding truncation and PgVector column size
agentforge.embedding.dimensions=768
spring.ai.google.genai.embedding.text.dimensions=${agentforge.embedding.dimensions}
spring.ai.vectorstore.pgvector.dimensions=${agentforge.embedding.dimensions}

# Gemini vectors aren't normalized, so cosine (not Euclidean/dot product) is correct
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Spring AI creates vector_store; Flyway owns our own tables from Task 2 on
spring.ai.vectorstore.pgvector.initialize-schema=true

# Flyway owns the schema; Hibernate only validates entities against it
spring.jpa.hibernate.ddl-auto=validate

# Shared by JwtService (issues tokens) and SecurityConfig (validates them)
agentforge.jwt.issuer=agentforge
agentforge.jwt.ttl=1h

# Seeded platform admin - no self-signup anywhere
agentforge.admin.email=admin@agentforge.local

# Document upload size cap
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Milestone 3 will experiment with this value (e.g. 800 vs 400)
agentforge.rag.chunk-size=800

# TenantAwareRetriever's search parameters
agentforge.rag.top-k=5
agentforge.rag.similarity-threshold=0.5

# How many past messages MessageWindowChatMemory keeps per conversation
agentforge.chat.memory.window-size=20

# simple = retriever only; advanced (Task 7) adds query rewriting/expansion
agentforge.rag.mode=simple
